<!doctype html><html lang="vi"><meta charset="utf-8"><title>360dep — Store assets</title>
<style>
@font-face{font-family:Be;src:url(regular.ttf)}@font-face{font-family:Be;src:url(bold.ttf);font-weight:700}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#faf6f4;color:#2a1b1e;font-family:Be,Arial,sans-serif}.asset{position:relative;overflow:hidden;background:#faf6f4}.asset:before{content:"";position:absolute;width:1100px;height:1100px;border-radius:50%;background:#f4e4e4;right:-450px;top:-580px}.apple{width:1284px;height:2778px}.brand{position:absolute;top:72px;left:100px;display:flex;align-items:center;gap:24px;font-size:44px;letter-spacing:-2px;font-weight:700}.brand img{width:82px;height:82px;border-radius:20px}.title{position:absolute;top:220px;left:100px;font-size:88px;font-weight:700;line-height:1.18;letter-spacing:-3px;max-width:1110px;margin:0}.sub{position:absolute;top:455px;left:100px;font-size:35px;line-height:1.5;color:#755e62;max-width:1060px}.screen{position:absolute;left:142px;top:590px;width:1000px;border:2px solid #eadad7;border-radius:44px;overflow:hidden;box-shadow:0 30px 100px #2a1b1e1a}.screen img{display:block;width:100%;height:auto}.icon{width:512px;height:512px}.icon:before{display:none}.icon img{width:512px;height:512px;display:block}.feature{width:1024px;height:500px;background:#2a1b1e;color:#fff}.feature:before{background:#5a323b;width:620px;height:620px;top:-240px;right:-260px}.feature .brand{top:65px;left:70px;font-size:43px}.feature .brand img{width:74px;height:74px}.feature .title{top:175px;left:70px;font-size:49px;line-height:1.22;letter-spacing:-1px;width:820px}.feature .sub{top:330px;left:70px;font-size:24px;color:#dfc4c6;width:850px}.feature .line{position:absolute;bottom:62px;left:70px;width:70px;height:5px;background:#c4868c;border-radius:5px}
</style><main id="asset"></main>
<script>
const type=new URLSearchParams(location.search).get('type')||'discover';const box=document.getElementById('asset');
if(type==='icon'){box.className='asset icon';box.innerHTML='<img src="icon-native.png" alt="360dep">'}
else if(type==='feature'){box.className='asset feature';box.innerHTML='<div class="brand"><img src="icon-native.png" alt="">360dep</div><h1 class="title">Làm đẹp và chụp ảnh<br>quanh bạn.</h1><p class="sub">Xem tác phẩm · Chọn dịch vụ · Đặt lịch rõ giá</p><div class="line"></div>'}
else{const price=type==='prices';box.className='asset apple';box.innerHTML='<div class="brand"><img src="icon-native.png" alt="">360dep</div><h1 class="title">'+(price?'Gói dịch vụ rõ ràng.<br>Giá được chọn sẵn.':'Chọn người làm.<br>Xem tác phẩm trước.')+'</h1><p class="sub">'+(price?'Xem nội dung, thời gian và mức giá của từng gói.':'Khám phá làm đẹp và chụp ảnh theo nhu cầu của bạn.')+'</p><div class="screen"><img src="'+(price?'02-prices-native.png':'01-discover-ready-native.png')+'" alt="Giao diện native thực tế của 360dep"></div>'}
</script></html>
